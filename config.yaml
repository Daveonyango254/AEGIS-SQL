# ============================================================================
# AEGIS v1 — accuracy-first text-to-SQL configuration
# ----------------------------------------------------------------------------
# Pipeline: schema stage (recall-first) -> candidate pool (local GRPO SLM and/or
# remote LLM) -> execution-vote grouping -> CSC merge-revision (top-2 groups) ->
# judge tie-break -> bounded refine -> 3-stage verification.
# Cost and privacy are ISOLATED in this configuration (the paper's abstraction /
# routing code is parked in the repo, not wired into this pipeline).
# ============================================================================

language: english

# Candidate pool: local (SLM only) | remote (LLM only) | ensemble (both, max accuracy)
mode: ensemble

# HARDWARE NOTE: generator + merger are two 7B models — ~30GB VRAM at fp16.
# On RunPod an A40 48GB (~$0.39/hr) fits both and is CHEAPER than 24GB PRO cards.
# On a 24GB GPU choose ONE of: (a) set merger == generator (single model, both
# roles), (b) quantization: 4bit, (c) allow_cpu_offload: true (10-100x slower —
# not recommended). By default a model that doesn't fit fails loudly at load.
models:
  generator: cycloneboy/CscSQL-Grpo-Qwen2.5-Coder-7B-Instruct  # CSC candidate generator
  merger: cycloneboy/CscSQL-Merge-Qwen2.5-Coder-7B-Instruct    # CSC merge-revision model
  remote: gpt-4o               # remote ensemble arm (openai or anthropic model id)
  remote_provider: openai
  embedding: BAAI/bge-m3       # linked-retrieval embeddings
  device: auto                 # local SLM device map
  embedding_device: cuda
  torch_dtype: float16
  backend: auto                # hf | vllm | auto (vLLM when installed: 5-10x faster sampling)
  quantization: none           # none | 8bit | 4bit (bitsandbytes; 24GB escape hatch)
  allow_cpu_offload: false     # keep false: CPU-offloaded inference looks like a hang
  vllm_gpu_fraction_generator: 0.55  # per-engine GPU share when backend=vllm
  vllm_gpu_fraction_merger: 0.35
  cache_dir: ~/.cache/huggingface
  hf_token: ${HF_HUB_TOKEN}    # from .env
  api_key: ${OPENAI_API_KEY}   # from .env

retrieval:
  schema_mode: auto            # full | linked | auto (full schema up to full_max_columns)
  full_max_columns: 120        # BIRD dev DBs fit; big schemas fall back to linked
  per_table_columns: 12        # linked mode: column cap per table (keys/value-hits always kept)
  value_retrieval: true        # ground question literals to exact stored DB values
  max_value_probes: 200
  per_query_top_k: 40          # linked mode: columns per sub-query before fusion
  max_sub_queries: 6
  rerank: false                # linked mode: ColBERT re-rank

generation:
  local_candidates: 16         # GRPO samples per query (64 = CSC-SQL paper-faithful)
  remote_candidates: 4         # remote samples per strategy (0 disables the remote arm)
  remote_strategies: [direct, query_plan]
  temperature: 0.8             # CSC-SQL sampling temperature
  max_tokens: 1024
  local_chunk_size: 4          # HF backend: samples per generate() call (halves on OOM)

csc:
  enabled: true                # merge-revision on the top-2 disagreeing vote groups
  merge_candidates: 8          # merge model samples (CSC-SQL: 8)

selection:
  judge: auto                  # off | local | remote | auto (tie-breaks split votes)
  max_judge_candidates: 4
  timeout_seconds: 30          # per-candidate execution timeout during voting

refine:
  rounds: 1                    # bounded execution-feedback repair (0 disables)

verifier:
  grammar_check: true
  schema_check: true
  execution_check_slm: true
  execution_check_llm: true
  sample_size: 100
  timeout_seconds: 30
  max_repair_attempts: 1
  repair_on_empty: true

evaluation:
  bird_dev_path: ./data/bird_dev
  output_dir: ./results
  seed: 42
  metrics: [execution_accuracy, ves, cost_per_query, latency]

logging:
  level: INFO
  format: json
  file: ./logs/aegis_sql.log
